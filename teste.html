<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fireboy e Watergirl</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      background: #333;
      border: 4px solid white;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gravity = 0.6;
    const ground = 350;

    // Fireboy
    const fireboy = {
      x: 100,
      y: ground,
      w: 30,
      h: 50,
      color: "red",
      dx: 0,
      dy: 0,
      speed: 4,
      jump: -12,
      onGround: true
    };

    // Watergirl
    const watergirl = {
      x: 200,
      y: ground,
      w: 30,
      h: 50,
      color: "blue",
      dx: 0,
      dy: 0,
      speed: 4,
      jump: -12,
      onGround: true
    };

    // Portas de saída
    const doorFire = { x: 700, y: ground, w: 30, h: 50, color: "red" };
    const doorWater = { x: 750, y: ground, w: 30, h: 50, color: "blue" };

    // Controles
    const keys = {};

    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    function updatePlayer(player, left, right, up) {
      if (keys[left]) player.dx = -player.speed;
      else if (keys[right]) player.dx = player.speed;
      else player.dx = 0;

      if (keys[up] && player.onGround) {
        player.dy = player.jump;
        player.onGround = false;
      }

      player.x += player.dx;
      player.y += player.dy;

      player.dy += gravity;

      // chão
      if (player.y + player.h >= ground + player.h) {
        player.y = ground;
        player.dy = 0;
        player.onGround = true;
      }
    }

    function checkWin() {
      const fireInDoor =
        fireboy.x + fireboy.w > doorFire.x &&
        fireboy.x < doorFire.x + doorFire.w &&
        fireboy.y + fireboy.h >= doorFire.y;

      const waterInDoor =
        watergirl.x + watergirl.w > doorWater.x &&
        watergirl.x < doorWater.x + doorWater.w &&
        watergirl.y + watergirl.h >= doorWater.y;

      if (fireInDoor && waterInDoor) {
        ctx.fillStyle = "yellow";
        ctx.font = "40px Arial";
        ctx.fillText("VOCÊS VENCERAM!", 250, 200);
        return true;
      }
      return false;
    }

    function drawPlayer(p) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y - p.h, p.w, p.h);
    }

    function drawDoor(d) {
      ctx.fillStyle = d.color;
      ctx.fillRect(d.x, d.y - d.h, d.w, d.h);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // chão
      ctx.fillStyle = "#555";
      ctx.fillRect(0, ground + 50, canvas.width, 50);

      updatePlayer(fireboy, "ArrowLeft", "ArrowRight", "ArrowUp");
      updatePlayer(watergirl, "a", "d", "w");

      drawDoor(doorFire);
      drawDoor(doorWater);

      drawPlayer(fireboy);
      drawPlayer(watergirl);

      if (!checkWin()) {
        requestAnimationFrame(gameLoop);
      }
    }

    gameLoop();
  </script>
</body>
</html>
